<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love 💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Myanmar Text', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 350px;
            width: 90%;
            z-index: 10;
            transition: all 0.5s ease;
        }

        h2 {
            color: #d63384;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            position: relative;
            min-height: 50px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
            z-index: 2;
        }

        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: relative;
        }

        /* Success hidden content */
        .hidden-content {
            display: none;
            text-align: center;
        }

        .polaroid {
            background: white;
            padding: 10px 10px 25px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-radius: 5px;
            margin: 15px auto;
            transform: rotate(-3deg);
            width: 200px;
        }

        .polaroid img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 3px;
        }

        .polaroid p {
            margin: 8px 0 0 0;
            color: #555;
            font-size: 14px;
        }

        .message-box {
            background: #fff0f3;
            border: 1px dashed #ff4d6d;
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
            color: #d63384;
            line-height: 1.5;
        }

        /* Floating hearts and firework effect */
        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
            z-index: 5;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>ကိုကို့ကို ချစ်လား ချစ်လေး? 💖</h2>
        <div class="buttons" id="buttonContainer">
            <button class="btn" id="yesBtn" onclick="acceptLove()">ချစ်တယ် 💖</button>
            <button class="btn" id="noBtn" onclick="rejectLove()">မချစ်ဘူး 💔</button>
        </div>
    </div>

    <!-- Hidden audio (you can change the link to any mp3 link) -->
    <audio id="loveSong" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
    </audio>

    <script>
        let noClickCount = 0;
        const noMessages = [
            "မချစ်ဘူး 💔",
            "ကိုကို့ကိုတကယ်မချစ်နိုင်ဘူးလား 🥺",
            "ချစ်လေးသေချာပြန်စဉ်းစားပေးပါအုံး 😢",
            "နောက်တစ်ခါ ထပ်စဉ်းစားပေးပါနော် 😭",
            "အင်ာ... မလုပ်နဲ့လေ 💔",
            "မျက်ရည်ကျပြီနော့ 💧",
            "ဖြတ်ချလိုက်တော့မှာနော် 😤"
        ];

        function rejectLove() {
            noClickCount++;
            let noBtn = document.getElementById('noBtn');
            let yesBtn = document.getElementById('yesBtn');

            if (noClickCount < 7) {
                // Change text & move randomly
                noBtn.innerText = noMessages[noClickCount];
                
                // Shrink no button slightly
                let currentScale = 1 - (noClickCount * 0.08);
                noBtn.style.transform = `scale(${currentScale})`;

                // Grow yes button
                let yesScale = 1 + (noClickCount * 0.15);
                yesBtn.style.transform = `scale(${yesScale})`;

                // Random move
                let x = (Math.random() - 0.5) * 150;
                let y = (Math.random() - 0.5) * 100;
                noBtn.style.transform += ` translate(${x}px, ${y}px)`;
            } else {
                // Completely hide after 7 clicks
                noBtn.style.display = 'none';
            }
        }

        function acceptLove() {
            // Play music
            let song = document.getElementById('loveSong');
            song.play().catch(e => console.log("Audio play blocked"));

            // Trigger fireworks
            createFireworks();

            // Change card content to photos and message
            let card = document.getElementById('mainCard');
            card.innerHTML = `
                <h2>💌 ကိုကို့ဆီက ရင်ဖွင့်လွှာ 💌</h2>
                <div class="polaroid">
                    <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=500" alt="Memory 1">
                    <p>အမြဲတမ်း တူတူ 📸💕</p>
                </div>
                <div class="message-box">
                    💖 <b>ကိုကို့ဆီက ရင်ဖွင့်လွှာ:</b><br>
                    ချစ်လေးရေ... ကိုကိုဘဝထဲ ရောက်လာပေးလို့ အရမ်းကျေးဇူးတင်ပါတယ်။ ချစ်လေးရဲ့ အပြုံးလေးတွေက ကိုကိုအတွက် အကောင်းဆုံး ခွန်အားပါပဲ။ အမြဲတမ်း ဂရုစိုက်ပြီး အနားမှာ ရှိနေပေးမယ်နော်... Love you forever! 🌹
                </div>
            `;
        }

        function createFireworks() {
            for (let i = 0; i < 40; i++) {
                let firework = document.createElement('div');
                firework.classList.add('firework');
                firework.style.left = '50%';
                firework.style.top = '50%';
                
                let angle = Math.random() * Math.PI * 2;
                let distance = Math.random() * 150 + 50;
                let tx = Math.cos(angle) * distance + 'px';
                let ty = Math.sin(angle) * distance + 'px';
                
                firework.style.setProperty('--x', tx);
                firework.style.setProperty('--y', ty);
                firework.style.backgroundColor = ['#ff4d6d', '#ff758c', '#ff7eb3', '#ffd166', '#4ea8de'][Math.floor(Math.random() * 5)];
                
                document.body.appendChild(firework);
                setTimeout(() => firework.remove(), 1000);
            }
        }
    </script>
</body>
</html>
